[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
priority=10
autorestart=true

[program:window-manager]
command=/usr/bin/openbox
priority=20
autorestart=true
startretries=20

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true
startretries=20

[program:web-desktop]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 localhost:5900
priority=40
autorestart=true

[program:aliasmode]
command=/opt/kit/container/launch-app.sh
priority=50
autorestart=true
startretries=5
stdout_logfile=/tmp/aliasmode.log
stderr_logfile=/tmp/aliasmode-error.log

[program:initial-profile]
command=/usr/bin/python3 /opt/kit/tools/bootstrap_profile.py
priority=60
autorestart=false
startsecs=0
stdout_logfile=/tmp/bootstrap.log
stderr_logfile=/tmp/bootstrap-error.log
