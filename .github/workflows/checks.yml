name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: find scripts -name '*.mjs' -exec node --check {} \;
      - run: docker compose config --quiet
      - run: docker build -t instagram-aliasmode-kit:test .
      - name: Verify container startup without Instagram credentials
        run: |
          docker run -d --name aliasmode-kit-check --shm-size=2g instagram-aliasmode-kit:test
          docker exec aliasmode-kit-check python3 tools/check_container.py
      - name: Startup diagnostics
        if: failure()
        run: |
          docker logs aliasmode-kit-check || true
          docker exec aliasmode-kit-check cat /tmp/aliasmode-error.log || true
          docker exec aliasmode-kit-check cat /tmp/bootstrap-error.log || true
